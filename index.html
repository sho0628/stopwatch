<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="時計">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>ストップウォッチ</title>
<style>
  :root {
    --green: #30d158;
    --green-fill: #0c4a23;
    --red: #ff453a;
    --red-fill: #5c1714;
    --grey-text: #ebebeb;
    --grey-fill: #313134;
    --orange: #ff9f0a;
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0;
    padding: env(safe-area-inset-top) 0 0;
  }

  /* ===== Timer ===== */
  .timer-area {
    flex: 0 0 38%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #timer {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    font-size: 22vw;
    font-weight: 100;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    white-space: nowrap;
  }

  /* ===== Controls row ===== */
  .controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px;
  }

  .btn {
    width: 86px; height: 86px;
    border-radius: 50%;
    border: none;
    font-size: 19px;
    font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: filter .08s;
  }
  .btn:active { filter: brightness(1.4); }

  #leftBtn { background: var(--grey-fill); color: var(--grey-text); }
  #leftBtn.disabled { opacity: .5; pointer-events: none; }

  #rightBtn.start { background: var(--green-fill); color: var(--green); }
  #rightBtn.stop  { background: var(--red-fill);   color: var(--red); }

  /* page indicator dots */
  .dots { display: flex; gap: 9px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: #5a5a5e; }
  .dots span.active { background: #fff; }

  /* ===== Lap list ===== */
  .laps {
    flex: 1 1 auto;
    overflow-y: auto;
    margin: 22px 16px 0;
    border-top: 0.5px solid rgba(255,255,255,0.22);
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .lap-row {
    display: flex; justify-content: space-between;
    padding: 13px 4px;
    font-size: 17px;
    border-bottom: 0.5px solid rgba(255,255,255,0.13);
    font-variant-numeric: tabular-nums;
  }

  /* ===== Bottom tab bar ===== */
  .tabbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    padding: 0 12px 4px;
  }
  .tabwrap {
    width: 100%;
    display: flex;
    background: rgba(40, 40, 43, 0.9);
    border: 0.5px solid rgba(255, 255, 255, 0.09);
    border-radius: 30px;
    padding: 6px 5px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .tab {
    flex: 1;
    display: flex;
    justify-content: center;
  }
  .tabinner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 11px;
    border-radius: 18px;
    color: #fff;
    font-size: 10px;
    white-space: nowrap;
  }
  .tabinner svg { width: 25px; height: 25px; }
  .tab.active .tabinner {
    background: rgba(142, 142, 147, 0.55);
    color: var(--orange);
  }

  /* ===== Secret setup overlay ===== */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.93);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; padding: 24px;
  }
  #overlay.show { display: flex; }
  .ov-title { font-size: 15px; color: #8e8e93; margin-bottom: 10px; }
  .ov-preview {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    font-size: 54px; font-weight: 200; font-variant-numeric: tabular-nums; margin-bottom: 22px;
  }
  .ov-preview .dot { color: var(--green); }
  .keypad { display: grid; grid-template-columns: repeat(3, 74px); gap: 16px; margin-bottom: 24px; }
  .key { width: 74px; height: 74px; border-radius: 50%; background: #1c1c1e; color: #fff; font-size: 30px; font-weight: 300; border: none; cursor: pointer; }
  .key:active { background: #3a3a3c; }
  .key.fn { font-size: 17px; color: #bbb; }
  .ov-actions { display: flex; gap: 14px; }
  .ov-btn { padding: 13px 24px; border-radius: 24px; border: none; font-size: 16px; font-weight: 500; cursor: pointer; }
  .ov-btn.arm { background: var(--green); color: #000; }
  .ov-btn.normal { background: #333; color: #fff; }
  .ov-btn.close { background: transparent; color: #8e8e93; }
  .ov-hint { margin-top: 18px; font-size: 12px; color: #5a5a5e; text-align: center; line-height: 1.6; }
</style>
</head>
<body>

  <div class="timer-area">
    <div id="timer"><span class="num">00:00</span><span class="dot">.</span><span class="cs">00</span></div>
  </div>

  <div class="controls">
    <button id="leftBtn" class="btn disabled">ラップ</button>
    <div class="dots"><span class="active"></span><span></span></div>
    <button id="rightBtn" class="btn start">開始</button>
  </div>

  <div class="laps" id="laps"></div>

  <nav class="tabbar">
    <div class="tabwrap">
      <div class="tab">
        <div class="tabinner">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="14" cy="14" r="10.5"/><ellipse cx="14" cy="14" rx="4.3" ry="10.5"/><path d="M3.7 14h20.6"/><path d="M5.9 8.5h16.2"/><path d="M5.9 19.5h16.2"/></svg>
          <span>世界時計</span>
        </div>
      </div>
      <div class="tab">
        <div class="tabinner">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="15.8" r="7.6"/><path d="M14 12.4v3.4l2.4 1.4"/><path d="M3.6 9.1C3.2 6.4 4.8 4 7.4 3.2"/><path d="M24.4 9.1C24.8 6.4 23.2 4 20.6 3.2"/><path d="M8.6 22.6 6.7 24.9"/><path d="M19.4 22.6 21.3 24.9"/></svg>
          <span>アラーム</span>
        </div>
      </div>
      <div class="tab active">
        <div class="tabinner">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="16.4" r="7.9"/><path d="M14 16.4 16.7 13.1"/><path d="M11.6 4h4.8"/><path d="M14 4v2.4"/><path d="M21.7 7 23.2 5.5"/></svg>
          <span>ストップウォッチ</span>
        </div>
      </div>
      <div class="tab">
        <div class="tabinner">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="16" r="8.4"/><path d="M14 16V10.2"/><path d="M9.6 3.5h8.8"/><path d="M14 5.9V3.5"/></svg>
          <span>タイマー</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Secret setup (long-press the timer to open) -->
  <div id="overlay">
    <div class="ov-title">強制する数字をセット　（右から MM:SS.CC）</div>
    <div class="ov-preview"><span class="num">00:00</span><span class="dot">.</span><span class="cs">00</span></div>
    <div class="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key fn" data-k="clear">クリア</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="back">⌫</button>
    </div>
    <div class="ov-actions">
      <button class="ov-btn arm" id="armBtn">セット（仕込む）</button>
      <button class="ov-btn normal" id="normalBtn">通常モード</button>
      <button class="ov-btn close" id="closeBtn">閉じる</button>
    </div>
    <div class="ov-hint">
      セットすると、次に「停止」した時に必ずこの数字が表示されます。<br>
      通常の時計に戻すには「通常モード」を押してください。
    </div>
  </div>

<script>
(function () {
  "use strict";

  var running = false, elapsed = 0, startTs = 0;
  var armed = false, forcedMs = 0;
  var laps = [], lastLapAt = 0, rafId = null;

  var timerEl = document.getElementById("timer");
  var leftBtn = document.getElementById("leftBtn");
  var rightBtn = document.getElementById("rightBtn");
  var lapsEl = document.getElementById("laps");
  var overlay = document.getElementById("overlay");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function parts(ms) {
    var totalCs = Math.floor(ms / 10);
    var cs = totalCs % 100, totalSec = Math.floor(totalCs / 100);
    return { min: Math.floor(totalSec / 60), sec: totalSec % 60, cs: cs };
  }
  function render(ms, el) {
    var p = parts(ms);
    el.querySelector(".num").textContent = pad(p.min) + ":" + pad(p.sec);
    el.querySelector(".cs").textContent = pad(p.cs);
  }
  function currentMs() { return running ? elapsed + (performance.now() - startTs) : elapsed; }

  function tick() {
    render(currentMs(), timerEl);
    if (running) rafId = requestAnimationFrame(tick);
  }

  function updateButtons() {
    if (running) {
      rightBtn.textContent = "停止"; rightBtn.className = "btn stop";
      leftBtn.textContent = "ラップ"; leftBtn.classList.remove("disabled");
    } else if (elapsed > 0) {
      rightBtn.textContent = "開始"; rightBtn.className = "btn start";
      leftBtn.textContent = "リセット"; leftBtn.classList.remove("disabled");
    } else {
      rightBtn.textContent = "開始"; rightBtn.className = "btn start";
      leftBtn.textContent = "ラップ"; leftBtn.classList.add("disabled");
    }
  }

  function start() {
    running = true; startTs = performance.now();
    updateButtons(); tick();
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    elapsed += performance.now() - startTs;
    if (armed) elapsed = forcedMs;          // === THE FORCE ===
    render(elapsed, timerEl);
    updateButtons();
  }
  function reset() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    elapsed = 0; laps = []; lastLapAt = 0;
    renderLaps(); render(0, timerEl); updateButtons();
  }
  function lap() {
    var now = currentMs();
    laps.push(now - lastLapAt); lastLapAt = now;
    renderLaps();
  }
  function renderLaps() {
    var html = "";
    for (var i = laps.length - 1; i >= 0; i--) {
      var p = parts(laps[i]);
      html += '<div class="lap-row"><span>ラップ ' + (i + 1) + '</span><span>' +
              pad(p.min) + ":" + pad(p.sec) + "." + pad(p.cs) + "</span></div>";
    }
    lapsEl.innerHTML = html;
  }

  rightBtn.addEventListener("click", function () { if (running) stop(); else start(); });
  leftBtn.addEventListener("click", function () {
    if (leftBtn.classList.contains("disabled")) return;
    if (running) lap(); else reset();
  });

  // secret long-press to open setup
  var pressTimer = null;
  function startPress() { pressTimer = setTimeout(openOverlay, 650); }
  function cancelPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }
  timerEl.addEventListener("touchstart", startPress, { passive: true });
  timerEl.addEventListener("touchend", cancelPress);
  timerEl.addEventListener("touchmove", cancelPress);
  timerEl.addEventListener("mousedown", startPress);
  timerEl.addEventListener("mouseup", cancelPress);
  timerEl.addEventListener("mouseleave", cancelPress);

  // setup overlay
  var entry = "";
  var preview = overlay.querySelector(".ov-preview");
  function entryToMs(str) {
    var d = ("000000" + str).slice(-6);
    return (parseInt(d.slice(0, 2), 10) * 60 + parseInt(d.slice(2, 4), 10)) * 1000 +
           parseInt(d.slice(4, 6), 10) * 10;
  }
  function renderPreview() { render(entryToMs(entry || "0"), preview); }
  function openOverlay() {
    cancelPress();
    if (armed && forcedMs > 0) {
      var p = parts(forcedMs);
      entry = ("" + pad(p.min) + pad(p.sec) + pad(p.cs)).replace(/^0+/, "");
    } else { entry = ""; }
    renderPreview();
    overlay.classList.add("show");
  }
  function closeOverlay() { overlay.classList.remove("show"); }

  overlay.querySelectorAll(".key").forEach(function (k) {
    k.addEventListener("click", function () {
      var v = k.getAttribute("data-k");
      if (v === "clear") entry = "";
      else if (v === "back") entry = entry.slice(0, -1);
      else if (entry.length < 6) entry = (entry + v).replace(/^0+/, "");
      renderPreview();
    });
  });
  document.getElementById("armBtn").addEventListener("click", function () {
    forcedMs = entryToMs(entry || "0"); armed = true; closeOverlay();
  });
  document.getElementById("normalBtn").addEventListener("click", function () {
    armed = false; closeOverlay();
  });
  document.getElementById("closeBtn").addEventListener("click", closeOverlay);

  render(0, timerEl); updateButtons();
})();
</script>
</body>
</html>
