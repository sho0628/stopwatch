<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ストップウォッチ">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>ストップウォッチ</title>
<style>
  :root {
    --green: #30d158;
    --green-bg: rgba(48, 209, 88, 0.16);
    --green-ring: rgba(48, 209, 88, 0.55);
    --red: #ff453a;
    --red-bg: rgba(255, 69, 58, 0.16);
    --red-ring: rgba(255, 69, 58, 0.55);
    --grey: #d6d6d6;
    --grey-bg: #333333;
    --grey-ring: rgba(255, 255, 255, 0.18);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    position: fixed;
    inset: 0;
  }

  /* ===== Timer display ===== */
  .timer-area {
    flex: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  #timer {
    font-size: 22vw;
    font-weight: 150;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    line-height: 1;
    white-space: nowrap;
  }

  /* the dot turns faint green when the force is armed (performer-only cue) */
  #timer .dot { transition: color .25s; }
  #timer.armed .dot { color: rgba(48, 209, 88, 0.85); }

  /* ===== Buttons ===== */
  .controls {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 14vw 6vh;
  }

  .btn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    font-size: 17px;
    font-weight: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    background: transparent;
    transition: filter .08s;
  }
  .btn::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 1px solid currentColor;
    opacity: .35;
  }
  .btn:active { filter: brightness(1.35); }

  #leftBtn { color: var(--grey); background: var(--grey-bg); }
  #leftBtn::after { border-color: var(--grey-ring); opacity: 1; }
  #leftBtn.disabled { opacity: .45; pointer-events: none; }

  #rightBtn.start { color: var(--green); background: var(--green-bg); }
  #rightBtn.start::after { border-color: var(--green-ring); opacity: 1; }
  #rightBtn.stop { color: var(--red); background: var(--red-bg); }
  #rightBtn.stop::after { border-color: var(--red-ring); opacity: 1; }

  /* ===== Lap list ===== */
  .laps {
    flex: 1.3;
    overflow-y: auto;
    margin: 0 22px;
    border-top: 0.5px solid rgba(255,255,255,0.18);
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .lap-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 4px;
    font-size: 17px;
    border-bottom: 0.5px solid rgba(255,255,255,0.12);
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .lap-row .label { color: #fff; }

  /* ===== Secret setup overlay ===== */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 24px;
  }
  #overlay.show { display: flex; }

  .ov-title { font-size: 15px; color: #8e8e93; margin-bottom: 10px; letter-spacing: .04em; }
  .ov-preview {
    font-size: 56px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    margin-bottom: 22px;
  }
  .ov-preview .dot { color: var(--green); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 74px);
    gap: 16px;
    margin-bottom: 24px;
  }
  .key {
    width: 74px; height: 74px;
    border-radius: 50%;
    background: #1c1c1e;
    color: #fff;
    font-size: 30px;
    font-weight: 300;
    border: none;
    cursor: pointer;
  }
  .key:active { background: #3a3a3c; }
  .key.fn { font-size: 17px; color: #bbb; }

  .ov-actions { display: flex; gap: 14px; }
  .ov-btn {
    padding: 13px 26px;
    border-radius: 24px;
    border: none;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  .ov-btn.arm { background: var(--green); color: #000; }
  .ov-btn.normal { background: #333; color: #fff; }
  .ov-btn.close { background: transparent; color: #8e8e93; }

  .ov-hint { margin-top: 18px; font-size: 12px; color: #5a5a5e; text-align: center; line-height: 1.6; }
</style>
</head>
<body>

  <div class="timer-area">
    <div id="timer"><span class="num">00:00</span><span class="dot">.</span><span class="cs">00</span></div>
  </div>

  <div class="controls">
    <button id="leftBtn" class="disabled">ラップ</button>
    <button id="rightBtn" class="start">スタート</button>
  </div>

  <div class="laps" id="laps"></div>

  <!-- Secret setup (long-press the timer to open) -->
  <div id="overlay">
    <div class="ov-title">強制する数字をセット　（右から MM:SS.CC）</div>
    <div class="ov-preview"><span class="num">00:00</span><span class="dot">.</span><span class="cs">00</span></div>
    <div class="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key fn" data-k="clear">クリア</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="back">⌫</button>
    </div>
    <div class="ov-actions">
      <button class="ov-btn arm" id="armBtn">セット（仕込む）</button>
      <button class="ov-btn normal" id="normalBtn">通常モード</button>
      <button class="ov-btn close" id="closeBtn">閉じる</button>
    </div>
    <div class="ov-hint">
      セットすると、次に「ストップ」した時に必ずこの数字が表示されます。<br>
      アーム中は時計の「.」がうっすら緑になります（演者用の目印）。
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- State ----------
  var running = false;
  var elapsed = 0;            // accumulated ms (paused total)
  var startTs = 0;            // performance.now() at last start
  var armed = false;
  var forcedMs = 0;
  var laps = [];
  var lastLapAt = 0;
  var rafId = null;

  // ---------- Elements ----------
  var timerEl = document.getElementById("timer");
  var leftBtn = document.getElementById("leftBtn");
  var rightBtn = document.getElementById("rightBtn");
  var lapsEl = document.getElementById("laps");
  var overlay = document.getElementById("overlay");

  // ---------- Time formatting ----------
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function parts(ms) {
    var totalCs = Math.floor(ms / 10);
    var cs = totalCs % 100;
    var totalSec = Math.floor(totalCs / 100);
    var sec = totalSec % 60;
    var min = Math.floor(totalSec / 60);
    return { min: min, sec: sec, cs: cs };
  }

  function render(ms, el) {
    var p = parts(ms);
    el.querySelector(".num").textContent = pad(p.min) + ":" + pad(p.sec);
    el.querySelector(".cs").textContent = pad(p.cs);
  }

  function currentMs() {
    return running ? elapsed + (performance.now() - startTs) : elapsed;
  }

  // ---------- Display loop ----------
  function tick() {
    render(currentMs(), timerEl);
    if (running) rafId = requestAnimationFrame(tick);
  }

  function setArmedCue() {
    timerEl.classList.toggle("armed", armed);
  }

  // ---------- Buttons ----------
  function updateButtons() {
    if (running) {
      rightBtn.textContent = "ストップ";
      rightBtn.className = "stop";
      leftBtn.textContent = "ラップ";
      leftBtn.classList.remove("disabled");
    } else if (elapsed > 0) {
      rightBtn.textContent = "スタート";
      rightBtn.className = "start";
      leftBtn.textContent = "リセット";
      leftBtn.classList.remove("disabled");
    } else {
      rightBtn.textContent = "スタート";
      rightBtn.className = "start";
      leftBtn.textContent = "ラップ";
      leftBtn.classList.add("disabled");
    }
  }

  function start() {
    running = true;
    startTs = performance.now();
    if (laps.length === 0) { laps = []; lastLapAt = 0; }
    updateButtons();
    tick();
  }

  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    elapsed += performance.now() - startTs;

    // === THE FORCE ===
    if (armed) {
      elapsed = forcedMs;           // freeze on the pre-set number
    }

    render(elapsed, timerEl);
    updateButtons();
  }

  function reset() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    elapsed = 0;
    laps = [];
    lastLapAt = 0;
    renderLaps();
    render(0, timerEl);
    updateButtons();
  }

  function lap() {
    var now = currentMs();
    var split = now - lastLapAt;
    lastLapAt = now;
    laps.push(split);
    renderLaps();
  }

  function renderLaps() {
    var html = "";
    for (var i = laps.length - 1; i >= 0; i--) {
      var p = parts(laps[i]);
      html += '<div class="lap-row"><span class="label">ラップ ' + (i + 1) +
              '</span><span>' + pad(p.min) + ":" + pad(p.sec) + "." + pad(p.cs) + "</span></div>";
    }
    lapsEl.innerHTML = html;
  }

  rightBtn.addEventListener("click", function () {
    if (running) stop(); else start();
  });

  leftBtn.addEventListener("click", function () {
    if (leftBtn.classList.contains("disabled")) return;
    if (running) lap(); else reset();
  });

  // ---------- Secret long-press to open setup ----------
  var pressTimer = null;
  function startPress() {
    pressTimer = setTimeout(openOverlay, 650);
  }
  function cancelPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  }
  timerEl.addEventListener("touchstart", startPress, { passive: true });
  timerEl.addEventListener("touchend", cancelPress);
  timerEl.addEventListener("touchmove", cancelPress);
  timerEl.addEventListener("mousedown", startPress);
  timerEl.addEventListener("mouseup", cancelPress);
  timerEl.addEventListener("mouseleave", cancelPress);

  // ---------- Setup overlay ----------
  var entry = "";  // up to 6 digits, fills MMSSCC from the right
  var preview = overlay.querySelector(".ov-preview");

  function entryToMs(str) {
    var d = ("000000" + str).slice(-6);
    var min = parseInt(d.slice(0, 2), 10);
    var sec = parseInt(d.slice(2, 4), 10);
    var cs = parseInt(d.slice(4, 6), 10);
    return (min * 60 + sec) * 1000 + cs * 10;
  }

  function renderPreview() {
    render(entryToMs(entry || "0"), preview);
  }

  function openOverlay() {
    cancelPress();
    // pre-fill with the currently armed value (if any) for easy tweaking
    if (armed && forcedMs > 0) {
      var p = parts(forcedMs);
      entry = ("" + pad(p.min) + pad(p.sec) + pad(p.cs)).replace(/^0+/, "");
    } else {
      entry = "";
    }
    renderPreview();
    overlay.classList.add("show");
  }

  function closeOverlay() { overlay.classList.remove("show"); }

  overlay.querySelectorAll(".key").forEach(function (k) {
    k.addEventListener("click", function () {
      var v = k.getAttribute("data-k");
      if (v === "clear") entry = "";
      else if (v === "back") entry = entry.slice(0, -1);
      else if (entry.length < 6) entry = (entry + v).replace(/^0+/, "");
      renderPreview();
    });
  });

  document.getElementById("armBtn").addEventListener("click", function () {
    forcedMs = entryToMs(entry || "0");
    armed = true;
    setArmedCue();
    closeOverlay();
  });

  document.getElementById("normalBtn").addEventListener("click", function () {
    armed = false;
    setArmedCue();
    closeOverlay();
  });

  document.getElementById("closeBtn").addEventListener("click", closeOverlay);

  // ---------- Init ----------
  render(0, timerEl);
  updateButtons();
  setArmedCue();
})();
</script>
</body>
</html>
