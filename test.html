<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCROLLテスト">
<title>scroll test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { background: #000; }
  body {
    /* ★ ここがポイント：固定せず、普通にスクロールする長い文書にする */
    min-height: 160vh;
    color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-overflow-scrolling: touch;
  }
  #dbg {
    position: fixed; top: env(safe-area-inset-top); left: 0; right: 0;
    text-align: center; font-size: 13px; color: #0f0; padding: 4px; z-index: 10;
    background: rgba(0,0,0,0.6);
  }
  .spacer {
    padding-top: calc(env(safe-area-inset-top) + 40px);
    text-align: center; font-size: 16px; color: #888; line-height: 2;
  }
  .fill { height: 90vh; background: linear-gradient(#111, #333); }
  /* 文書の末尾の要素：ここが画面の一番下（ホームバー下）まで届くか？ */
  #bottom {
    background: #ff3b30; color: #fff; font-size: 20px; font-weight: 700;
    text-align: center; padding: 30px 0;
    /* 末尾まで色を伸ばす */
  }
  #edge {
    background: #34c759; text-align: center; color: #000; font-weight: 700; padding: 14px 0;
  }
</style>
</head>
<body>
  <div id="dbg">計測中…</div>
  <div class="spacer">
    ↓ 下までスクロールしてください ↓<br>
    赤い帯が画面の一番下（ホームバー）まで<br>届くかを確認します
  </div>
  <div class="fill"></div>
  <div id="bottom">この赤い帯が文書の末尾です</div>
  <div id="edge">★ここが本当の最下端★（緑が画面の端まで行くか）</div>

<script>
  function probe() {
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden;';
    document.body.appendChild(p);
    var sab = parseFloat(getComputedStyle(p).paddingBottom) || 0;
    document.body.removeChild(p);
    var vvh = window.visualViewport ? Math.round(window.visualViewport.height) : 0;
    var sh = window.screen ? window.screen.height : 0;
    document.getElementById('dbg').textContent =
      'ih=' + window.innerHeight + ' vvh=' + vvh + ' sh=' + sh + ' sab=' + Math.round(sab) + ' sa=' + (navigator.standalone ? 'Y' : 'N');
  }
  probe();
  window.addEventListener('resize', probe);
  window.addEventListener('scroll', probe);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', probe);
  setTimeout(probe, 600);
</script>
</body>
</html>
